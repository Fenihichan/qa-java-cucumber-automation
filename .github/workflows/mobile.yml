name: Mobile Tests

on:
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Start emulator
      # Start Appium

      - name: Run Mobile Tests
        run: mvn test -Dtest=MobileTestRunner