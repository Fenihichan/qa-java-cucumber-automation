name: Mobile Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Android Emulator and Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-snapshot
            -camera-back none
            -camera-front none

          script: |
            echo "Starting Appium..."
            appium --log-level debug > appium.log 2>&1 &

            echo "Waiting for Appium..."
            until curl -s http://127.0.0.1:4723/status; do
              sleep 2
            done

            echo "ADB devices:"
            adb devices -l

            echo "Connected device properties:"
            adb shell getprop ro.build.version.release || true

            echo "Installed packages:"
            adb shell pm list packages | head -20 || true

            echo "Running Tests..."
            mvn -B clean test -Dtest=MobileTestRunner

      - name: Save Logcat
        if: always()
        run: adb logcat -d > logcat.txt

      - name: Upload Appium Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log

      - name: Upload Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports