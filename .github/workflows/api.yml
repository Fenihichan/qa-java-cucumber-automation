name: API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run API Tests
        run: mvn clean test -Dtest=ApiTestRunner